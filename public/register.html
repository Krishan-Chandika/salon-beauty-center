<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><title>Create account | Lumière</title></head><body>
<main class="authbox "><form class="panel" id="f" data-mode="register" novalidate>
<a href="/" class="logo" style="color:var(--rose);font-size:1.4rem;text-decoration:none">Lumière</a>
<h1 style="margin-top:10px">Create account</h1><p class="sub">Join Lumière to book appointments online.</p><label for="name">Full name</label><input id="name" autocomplete="name"><span class="err"></span><label for="email">Email</label><input id="email" type="email" autocomplete="email"><span class="err"></span><label for="phone">Phone (optional)</label><input id="phone" type="tel"><span class="err"></span><label for="password">Password</label><input id="password" type="password" autocomplete="new-password"><span class="err"></span><label for="confirm">Confirm password</label><input id="confirm" type="password"><span class="err"></span>
<button class="btn" type="submit">Create account</button><p class="alt">Already a member? <a href="/login">Log in</a></p></form></main><script src="/js/main.js"></script><script src="/js/auth.js"></script></body></html>
